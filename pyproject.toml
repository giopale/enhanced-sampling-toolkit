[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced-sampling-toolkit"
version = "0.1.0.dev0"
description = "Analysis tools for MD + enhanced sampling (PLUMED/OPES) simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2",
    "rich",
    "typer",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
migrate = ["pyyaml"]
dev = ["pytest", "ruff", "pyyaml"]

[project.scripts]
estk = "estk.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["to_refactor", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
