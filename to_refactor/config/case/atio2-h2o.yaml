# @package _global_

mplstyle:
    dir: /users/pgiorgio/scripts/mymplstyles/mymplstyles
    style: jcp.mplstyle

size: [2.76, 1.3]


dir_md: '.'
dir_job: '00*'

file_fes:  'pot*-rew-fes.dat'

temp: 350
bias_factor: null 

nbins: [100, 100]
ngrid: [100, 100]
fes_shift_to_zero: False
# nbins is equal to nedges -1
#sigma: [null, null]


file_model_devi: model_devi.out

property: fes
just_average: False
time_interval: [null, null] # md time interval in nanoseconds


convergence_barrier:
  analyze_average: True
  time:
    #time_interval: [0,5]
    #time_step: .1
    #fname_mep: 'd0-cn-fes-MEP.dat'
    #do_reweight: True
    time_interval: [0,20]
    time_step: .5
    #fname_mep: 'd0-cn-fes-MEP.dat'
    do_reweight: True
  parameter:
    select: sigma_d0
    sigma_cn:
      do_reweight: True
      xlabel: '$\sigma_{\text{CN}}$'
      funct_mesh:
        geomspace:
          start: 0.001
          stop: 0.5
          num: 20
          endpoint: True
    sigma_d0:
      do_reweight: True
      xlabel: '$d(\text{Ti-O})\ (\AA)$'
      funct_mesh:
        geomspace:
          start: 0.001
          stop: 0.5
          num: 20
          endpoint: True
        


cvs:
    select: ['d0', 'cn'] #[ 'd0', 'cn']
    add: null
    #filter:
    #    cn: [0.8,3.0]
    cn: # cn 
        limits: [0.75,null]
        #limits: [0.75,1.25]
        sigma: 0.033
    cn_O2c: # cn 
        limits: [0.0,13]
        #limits: [0.75,null]
        sigma: 0.033
    d0: # Ti-O distance
        limits: [1.5, 2.5]
        #limits: [1.7, 2.1]
        sigma: 0.02161725

    dOH_min: 
        limits: [.8, 1.1]

    dOOliq_min: 
        limits: [2.2,3.5 ]
        sigma: 0.00875339
    dOO2c_min: 
        limits: [2.2,3.5 ]

    theta1: 
        limits: [1.0,2.5 ]
        scale: 57.29577951308232 #180/pi
    theta2: 
        limits: [1.0,2.5 ]
        scale: 57.29577951308232 #180/pi

    thetaH_z: 
        limits: [0,6.3 ]

    Hbonds_received:
        limits: [0, 6]

    direct-delta:
        limits: &deltalimits [-1.5,1.5]
    direct-d:
        limits: &dlimits [2.2,3.0]
    indirect-delta:
        limits: *deltalimits
    indirect-d:
        limits: *dlimits
# AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    direct-delta-A:
        limits: *deltalimits
    direct-d-A:
        limits: *dlimits
    indirect-delta-A:
        limits: *deltalimits
        sigma: 0.01730002
    indirect-d-A:
        limits: *dlimits
        sigma: 0.00860539
# BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    direct-delta-B:
        limits: *deltalimits
    direct-d-B:
        limits: *dlimits
    indirect-delta-B:
        limits: *deltalimits
        sigma: 0.01730002
    indirect-d-B:
        limits: *dlimits
        sigma: 0.00860539
# BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    direct-delta-liquid:
        limits: *deltalimits
        sigma: 0.01766209
    direct-d-liquid:
        limits: *dlimits
        sigma: 0.00769627
    indirect-delta-liquid:
        limits: *deltalimits
    indirect-d-liquid:
        limits: *dlimits

    rmse-f:
      limits: [null, null]



