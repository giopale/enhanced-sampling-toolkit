cvs_along_mep:
    select_by_coordinate:
        cn: [null, null]
    plot:
        xaxis: 'linear' # 'linear', 'cn'
    axvline: null #[2] # zero based
    axvline_cn: [0.5,1.5] # zero based
    points: null #[0,7,9,14]



cvs:
    select: null #[ 'd3', 'cn']
    add: null
    filter:
        cn: [0.8,3.0]
    cn: # cn with r0=1.3
        limits: [0.0,null]
    cn1: # cn with r0=1.03
        limits: [0.0,2.5]
    cn2: # cn with r0=1.06
        limits: [0.0,2.5]
    cn3: # cn with r0=1.09 
        limits: [0.0,2.5]
    cn4: # cn with r0=1.2
        limits: [0.0,2.5]
    cn-p0: # cn with n=6
        limits: [0.0,2.5]
    cn-p1: # cn with n=12 (=cn)
        limits: [0.0,2.5]
    cn-p2: # cn with n=24 (=cn)
        limits: [0.0,2.5]
    cn-p3: # cn with n=48 (=cn)
        limits: [0.0,2.5]
    d0: # Ti-O distance
        limits: [1.5, 2.5]
    d2: # Ti-O distance
        limits: [1.5, 2.5]
    dz: # z component of the Ti-O distance
        limits: [1.5, 2.5]
    d3.min: # min distance btw Oads and Owater(all)
        limits: [2.0, 3.0]
    d4: # mean distance btw Ti and Osurf(all)
        limits: [1.9, 2.1]
    d5: # mean distance Quo O-Ti bonds (all)
        limits: [1.6, 2.1]
    d6.mean: # mean distance of the H closest to Oads
        limits: [0.8, 1.3]
    d6.min: # min distance of the H closest to Oads
        limits: [0.8, 1.3]
    cnO: # number of Owat between 3 and 4 A from Oads
        limits: [2.5, 8.0]
    cnO1: # number of Owat between 0 and 3.5 A from Oads
        limits: [0, 8.0]
    direct-delta:
        limits: &deltalimits [-1.5,1.5]
    direct-d:
        limits: &dlimits [2.2,3.0]
    indirect-delta:
        limits: *deltalimits
    indirect-d:
        limits: *dlimits
# AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    direct-delta-A:
        limits: *deltalimits
    direct-d-A:
        limits: *dlimits
    indirect-delta-A:
        limits: *deltalimits
    indirect-d-A:
        limits: *dlimits
# BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    direct-delta-B:
        limits: *deltalimits
    direct-d-B:
        limits: *dlimits
    indirect-delta-B:
        limits: *deltalimits
    indirect-d-B:
        limits: *dlimits
# CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
    direct-delta-C:
        limits: *deltalimits
    direct-d-C:
        limits: *dlimits
    indirect-delta-C:
        limits: *deltalimits
    indirect-d-C:
        limits: *dlimits
# DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDd 
    direct-delta-D:
        limits: *deltalimits
    direct-d-D:
        limits: *dlimits
    indirect-delta-D:
        limits: *deltalimits
    indirect-d-D:
        limits: *dlimits
    hb:
        limits: [0,4.0]
    cnsurf.sum:
        limits: [0,13]
    dOHliq.min:
        limits: [0,5.0]
    dOHliq.max:
        limits: [0,5.0]
    dOHliq.avg:
        limits: [0,5.0]
    dOHliq.number:
        limits: [0,5.0]


surface_data:
    fes: 
      file_data: 'pot*-rew-fes.dat'
      mark_points:
        points: *struct_points #[[2.0,1.9], [2.0,1.0],[1.1,0.1],[2.0,0.1]]
      mep:
          #midpoint: [0,2.36]
          split: vertical  #horizontal, vertical, triple # direction of the cut
          compute_all: True
          load: False
          fname_mep: null
          fname_mep_out: null
          maxsteps: 2000
          traj_every: 50
          npts: 15
          flexible: False
          dt: 0.01
          print_convergence: False
          save:
              plot: mep.png
             
      plot:
          size: [3.37, 1.89]
          row: 2
          col: 2
          scale: 1.5
          hspace: 0.3
          fontsize: 6
          vmin: 0.0
          vmax: 1.5
          levels: 15
          colormap: ['Blues','Greens','Greys']
          reverse_colormap: True
          limits: [null, null, null, null]
          xlabel: null #['min$[d$(O$_{\mathrm{surf}}$-O$_{\mathrm{ad}}$)] ', '($\mathrm{\AA}$)']  
          ylabel: null #['cn(O$_{\mathrm{ad}}$-H)']
          cbarlabel: 'energy (eV)'
          title: null
          suptitle: null
          mep: True
      save:
          plot: ['fes.png', 'fes.pdf']

    dist-TiO:
      file_data: '*rew-dist-TiO.dat'
      file_prop: dist-TiO
      prop_field: d2
      mep: True
      plot:
        size: [3.37, 1.89]
        row: 2
        col: 2
        scale: 1.5
        hspace: 0.3
        vmin: null #1.0
        vmax: null #3.0
        levels: 15
        #colormap: Reds
        colormap: ['Reds','Greens','Greys']
        reverse_colormap: True
        limits: [null, null, null, null]
        xlabel: ['min$[d$(O$_{\mathrm{surf}}$-O$_{\mathrm{ad}}$)] ', '($\mathrm{\AA}$)']
        ylabel: ['cn(O$_{\mathrm{ad}}$-H)']
        title: Ti-O distance
        cbarlabel: 'distance'
        points_of_interest: null
        mep: True
      save:
        plot: ['dist-TiO.png','dist-TiO.pdf']
 

